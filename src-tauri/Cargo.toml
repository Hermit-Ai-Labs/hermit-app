[package]
name = "hermit"
version = "0.1.0"
description = "Hermit, your own private agent"
authors = ["Hermit AI Labs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hermit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
