# XcodeGen spec: `xcodegen generate` writes Hermit.xcodeproj (not checked in).
name: Hermit
options:
  bundleIdPrefix: my.hermit
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  HermitKit:
    path: Packages/HermitKit
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  Hermit:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
    dependencies:
      - package: HermitKit
        product: HermitUI
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Hermit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 Hermit AI Labs
        NSCalendarsFullAccessUsageDescription: Hermit shows your calendar events next to your tasks. They stay on this device.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/macOS/Hermit.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.hermit.mac
        # The Mac app's version line in App Store Connect ("Hermit - Private AI for Mac", Apple ID 6831778645).
        MARKETING_VERSION: "1.1"
        PRODUCT_NAME: Hermit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Release is signed by scripts/release-mac-appstore.sh (Apple Distribution + the "Hermit Mac App Store" profile)
        # through HERMIT_MAC_IDENTITY and HERMIT_MAC_PROFILE, set on the app target only so the Swift package
        # resource bundles don't get a profile. scripts/release-mac.sh (Developer ID) overrides the identity itself.
        Release:
          DEVELOPMENT_TEAM: 4G5YW2XP2B
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: $(HERMIT_MAC_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(HERMIT_MAC_PROFILE)
  HermitiOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
    dependencies:
      - package: HermitKit
        product: HermitUI
      - package: HermitKit
        product: HermitModel
      - target: HermitWidgets
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Hermit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Hermit asks for Face ID before any money moves.
        NSCameraUsageDescription: Hermit uses the camera only to scan a wallet address QR code. Nothing is recorded or sent.
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Hermit shows your calendar events next to your tasks. They stay on this device.
        # The model download runs in a background URLSession; BGContinuedProcessingTask keeps its Live Activity live.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [my.hermit.ios.model-download.*]
        UIBackgroundModes: [processing]
    entitlements:
      path: App/iOS/Hermit.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        keychain-access-groups: [$(AppIdentifierPrefix)my.hermit.ios]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.hermit.ios
        # The iPhone app's own version line in App Store Connect ("Hermit - Private AI", Apple ID 6831777640).
        MARKETING_VERSION: "1.1"
        DEVELOPMENT_TEAM: 4G5YW2XP2B
        # Signed by scripts/run-iphone.sh and release-ios.sh with the certificates in ~/hermit/signing.keychain-db
        # (made through the App Store Connect API, so builds work over SSH). They set HERMIT_IDENTITY and HERMIT_PROFILE.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(HERMIT_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(HERMIT_PROFILE)
        PRODUCT_NAME: Hermit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HermitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets
    dependencies:
      - package: HermitKit
        product: HermitActivity
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hermit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.hermit.ios.widgets
        # Must match the app's version, or App Store Connect rejects the upload.
        MARKETING_VERSION: "1.1"
        DEVELOPMENT_TEAM: 4G5YW2XP2B
        # Signed like the app; the scripts set HERMIT_WIDGET_PROFILE.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(HERMIT_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(HERMIT_WIDGET_PROFILE)
        PRODUCT_NAME: HermitWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
