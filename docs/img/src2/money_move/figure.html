<!doctype html>
<html><head><meta charset="utf-8">
<title>One swap, end to end</title>
<style>
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --bg: #000000;
  --neon: #3CFF3C;
  --neon-dim: rgba(60,255,60,.55);
  --white: #FFFFFF;
  --ink2: #D9D9D9;
  --ink3: #A6A6A6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: transparent; }
body { width: 1200px; background: none; color: var(--white); font-family: 'Geist', system-ui; -webkit-font-smoothing: antialiased; }
#fig { position: relative; width: 1200px; background: var(--bg); border-radius: 28px; overflow: hidden; }
#fig > * { position: absolute; }

/* texture: faint scanlines, a soft glow behind the spine, a vignette */
.tex { left: 0; top: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px),
    radial-gradient(ellipse 34% 46% at 50% 52%, rgba(255,255,255,.075), transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 50%, transparent 60%, rgba(0,0,0,.6)); }
.grid { left: 0; top: 0; z-index: 0; }

.corner { font: 500 19px/24px 'Geist'; color: var(--white); letter-spacing: .01em; white-space: nowrap; }
.slash { font: 500 19px/24px 'Geist Mono'; color: var(--white); }
.eyebrow { display: flex; align-items: center; gap: 12px; font: 500 18px/24px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.eyebrow svg { width: 37px; height: 24px; }
h1 { font: 600 58px/64px 'Geist'; letter-spacing: -.03em; color: var(--white); white-space: nowrap;
  text-shadow: 0 0 22px rgba(255,255,255,.25); }
.sub { font: 400 22px/30px 'Geist'; color: var(--ink2); white-space: nowrap; }
.eyebrow, .sub, .hd, .slash, .corner { z-index: 3; }

.tag { display: inline-block; background: var(--neon); color: #000; font: 600 18px/26px 'Geist Mono'; letter-spacing: .03em;
  text-transform: uppercase; padding: 1px 10px 0; white-space: nowrap; box-shadow: 0 0 18px rgba(60,255,60,.28); }
.tag.white { background: var(--white); box-shadow: 0 0 22px rgba(255,255,255,.35); }
.tag.line { background: #000; color: var(--neon); outline: 1.5px solid var(--neon); outline-offset: -1.5px; box-shadow: none; }
.tag .n { opacity: .62; margin-right: 10px; }

.blk { z-index: 3; }
.blk.l { text-align: right; }
.blk .d { margin-top: 8px; font: 400 20px/27px 'Geist'; color: var(--ink2); white-space: nowrap; }
.blk .d.big { font: 500 23px/30px 'Geist'; color: var(--white); }
.blk .d.mono { font: 450 19px/26px 'Geist Mono'; color: var(--white); }
.list { margin-top: 10px; display: grid; grid-template-columns: auto auto; column-gap: 26px; row-gap: 4px; text-align: left; }
.blk.l .list { margin-left: auto; width: max-content; }
.list div { font: 400 19px/26px 'Geist'; color: var(--ink2); white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.list div::before { content: ''; width: 7px; height: 7px; background: var(--neon); flex: none; }

.colhead { font: 500 18px/24px 'Geist Mono'; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; z-index: 3; }

.phase { z-index: 1; border: 1.5px solid var(--neon); }
.phase .bar { position: absolute; left: -1.5px; right: -1.5px; top: -1.5px; height: 34px; background: var(--neon); color: #000;
  font: 600 18px/34px 'Geist Mono'; letter-spacing: .04em; text-transform: uppercase; padding: 0 14px; display: flex; justify-content: space-between; }

.subject { z-index: 3; text-align: center; }
.subject .s1 { font: 600 34px/38px 'Geist'; letter-spacing: -.02em; color: var(--white); white-space: nowrap; text-shadow: 0 0 24px rgba(255,255,255,.45); }
.subject .s2 { margin-top: 6px; font: 500 18px/24px 'Geist Mono'; letter-spacing: .06em; text-transform: uppercase; color: var(--neon); white-space: nowrap; }

.track { z-index: 3; display: flex; gap: 0; }
.track .st { width: 116px; text-align: center; font: 500 18px/24px 'Geist Mono'; letter-spacing: .02em; text-transform: uppercase; color: var(--white); padding-top: 22px; position: relative; }
.track .st::before { content: ''; position: absolute; left: 50%; top: 2px; width: 12px; height: 12px; margin-left: -6px; border: 1.5px solid var(--neon); background: #000; }
.track .st:last-child::before { background: var(--neon); }
.track::before { content: ''; position: absolute; left: 58px; right: 58px; top: 9px; height: 1.5px; background: var(--neon-dim); }
.note { z-index: 3; font: 500 23px/30px 'Geist'; color: var(--white); white-space: nowrap; text-shadow: 0 0 18px rgba(255,255,255,.3); }
.note .sl { font-family: 'Geist Mono'; color: var(--neon); margin-right: 12px; text-shadow: none; }

svg.lines { left: 0; top: 0; z-index: 2; overflow: visible; }
</style>
</head>
<body><div id="fig"></div>
<script>
const fig = document.getElementById('fig');
const W = 1200, PX = 64, SP = 600;          // SP: the spine, the swap's path
const GUT = 52;                              // space between a block and the spine
const ANCH = { tl:[0,0], tc:[-50,0], tr:[-100,0], cl:[0,-50], c:[-50,-50], cr:[-100,-50], bl:[0,-100], bc:[-50,-100], br:[-100,-100] };
function put(cls, x, y, html, a = 'tl', role = 'text', style = {}) {
  const d = document.createElement('div');
  d.className = cls; d.innerHTML = html; d.dataset.role = role;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  const [tx, ty] = ANCH[a]; if (tx || ty) d.style.transform = `translate(${tx}%, ${ty}%)`;
  Object.assign(d.style, style);
  fig.appendChild(d); return d;
}
const R = el => { const r = el.getBoundingClientRect(), f = fig.getBoundingClientRect(); return { x: r.left - f.left, y: r.top - f.top, w: r.width, h: r.height, r: r.right - f.left, b: r.bottom - f.top }; };
const tag = (n, t, cls = '') => `<span class="tag ${cls}">${n ? `<span class="n">${n}</span>` : ''}${t}</span>`;
const list = items => `<div class="list">${items.map(i => `<div>${i}</div>`).join('')}</div>`;

window.figureReady = (async () => {
await Promise.all(["600 18px 'Geist Mono'", "500 18px 'Geist Mono'", "450 19px 'Geist Mono'", "400 20px Geist", "600 58px Geist", "500 23px Geist"].map(f => document.fonts.load(f)));
await document.fonts.ready;

const lines = [];   // {pts, kind, head}
const nodes = [];   // {y, kind}
const focusPaths = [];

/* ---------- header ---------- */
put('eyebrow', PX, 56, `<svg viewBox="0 0 171.8 110"><g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h161.8v100H5zM105 5v100M105 66.8h61.8M128.6 66.8V105M105 81.4h23.6M119.6 66.8v14.6M5 105A100 100 0 0 1 105 5a61.8 61.8 0 0 1 61.8 61.8 38.2 38.2 0 0 1-38.2 38.2 23.6 23.6 0 0 1-23.6-23.6 14.6 14.6 0 0 1 14.6-14.6"/></g></svg><span>Hermit / the money path</span>`);
put('slash', W - PX, 56, '///', 'tr');
put('hd', PX - 2, 96, '<h1>One swap, end to end</h1>');
put('sub', PX, 174, 'The assistant prepares, you approve, and NEAR Intents settles.');

/* ---------- column heads + start of the path ---------- */
let y = 262;
put('colhead', SP - GUT, y, 'On your iPhone or Mac', 'tr');
put('colhead', SP + GUT, y, 'NEAR Intents 1Click, chains', 'tl');
y += 58;
const start = put('subject', SP, y, '<div class="s1">20 USDC</div><div class="s2">on Base</div>', 'tc', 'subject');
const SPINE_TOP = focus(start).y1;
y = R(start).b + 54;

/* ---------- rows ---------- */
// one row: optional left block, optional right block, an optional arrow across the spine.
function row(o) {
  const top = y;
  let L, Rt;
  if (o.l) L = put('blk l', SP - GUT, top, o.l, 'tr', 'block');
  if (o.r) Rt = put('blk r', SP + GUT, top, o.r, 'tl', 'block');
  if (o.note) put('note', SP + GUT, top - 1, `<span class="sl">///</span>${o.note}`, 'tl', 'block');
  const tagOf = el => R(el.querySelector('.tag'));
  const cy = top + 14;   // centre of the first tag line
  const lt = L && tagOf(L), rt = Rt && tagOf(Rt);
  if (o.arrow === 'lr') lines.push({ pts: [[lt.r + 1, cy], [rt.x - 2, cy]], kind: o.kind || 'neon', head: true });
  else if (o.arrow === 'rl') lines.push({ pts: [[rt.x - 1, cy], [lt.r + 2, cy]], kind: o.kind || 'neon', head: true, dash: o.dash });
  else {
    if (L) lines.push({ pts: [[lt.r + 1, cy], [SP, cy]], kind: 'call' });
    if (Rt) lines.push({ pts: [[SP, cy], [rt.x - 1, cy]], kind: 'call' });
  }
  nodes.push({ y: cy, kind: o.node || 'neon' });
  const b = Math.max(L ? R(L).b : 0, Rt ? R(Rt).b : 0);
  y = b + (o.after ?? 34);
  return { L, Rt, cy };
}
const phases = [];
function phase(num, name, fn) {
  const top = y;
  y = top + 34 + 30;
  fn();
  const bot = y - 34 + 28;
  phases.push({ num, name, top, bot });
  y = bot + 36;
}

phase('01', 'Assistant prepares', () => {
  row({ l: tag('01', 'You ask') + `<div class="d big">“Swap 20 USDC on Base to NEAR”</div>` });
  row({ l: tag('02', 'Assistant calls') + `<div class="d mono">prepare_swap</div>`,
        r: tag('03', 'Dry quote') + `<div class="d">Signed by 1Click</div>`, arrow: 'lr' });
  row({ l: tag('04', 'Checks on device') + list(['Quote signature', 'Under $100 a move', 'Within $500 a day', 'Token has a price', 'Loss under 10%', 'Pays out to you']) });
  row({ l: tag('05', 'Swap review opens') + `<div class="d">Filled in for you</div>`, note: 'The assistant only prepares' });
});
phase('02', 'You approve and sign', () => {
  row({ l: tag('06', 'You tap Review'), r: tag('07', 'Live quote') + `<div class="d">One-time deposit address</div>`, arrow: 'lr' });
  row({ l: tag('08', 'Checks again') + list(['Spending policy', 'Quote signature', 'Refunds to you']) });
  row({ l: tag('09', 'Face ID', 'white') + `<div class="d">You approve</div>`, node: 'white', note: 'Face ID before any signature' });
  row({ l: tag('10', 'Key vault signs', 'white') + `<div class="d">The Secure Enclave unseals the seed.<br>Hermit signs, then wipes the key.</div>`, node: 'white' });
  row({ l: tag('11', '20 USDC sent', 'white'), r: tag('', 'Base', 'line') + `<div class="d">To the one-time deposit address</div>`, arrow: 'lr', kind: 'white', node: 'white' });
});
phase('03', 'NEAR Intents settles', () => {
  row({ l: tag('12', 'Submit tx hash'), r: tag('13', 'Solvers fill the swap') + `<div class="d">wNEAR to your NEAR account</div>`, arrow: 'lr' });
  row({ l: tag('14', 'Live status') + `<div class="track" style="position:relative;margin-top:16px;margin-left:auto;width:max-content">${['Deposit', 'Seen', 'Swap', 'Delivered'].map(s => `<div class="st">${s}</div>`).join('')}</div>`,
        r: tag('', '1Click', 'line') + `<div class="d">Polled for status</div>`, arrow: 'rl', dash: true });
});

const endTop = y + 12;
const end = put('subject', SP, endTop, '<div class="s1">wNEAR</div><div class="s2">in your NEAR account</div>', 'tc', 'subject');
const SPINE_BOT = focus(end).y0;
y = R(end).b + 56;

/* ---------- footer ---------- */
put('corner', PX, y, 'iPhone and Mac');
put('slash', SP, y, '///', 'tc');
put('corner', W - PX, y, 'NEAR Intents', 'tr');
const H = y + 24 + 40;
fig.style.height = H + 'px'; document.body.style.height = H + 'px';

/* phase frames (drawn after rows, under them) */
for (const p of phases) {
  const d = put('phase', PX, p.top, `<div class="bar"><span>${p.num} /// ${p.name}</span><span>///</span></div>`, 'tl', 'frame',
    { width: (W - 2 * PX) + 'px', height: (p.bot - p.top) + 'px' });
}
put('tex', 0, 0, '', 'tl', 'deco');

/* focus brackets around the start and end of the path */
function focus(e) { const r = R(e); const x0 = r.x - 28, x1 = r.r + 28, y0 = r.y - 16, y1 = r.b + 14, L = 16;
  const d = `M${x0} ${y0 + L}V${y0}H${x0 + L}M${x1 - L} ${y0}H${x1}V${y0 + L}M${x1} ${y1 - L}V${y1}H${x1 - L}M${x0 + L} ${y1}H${x0}V${y1 - L}`;
  focusPaths.push(d); return { y0, y1 }; }
/* ---------- lines ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('class', 'lines'); svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = `<defs>
  <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="4000"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowS" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="4000"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`;
fig.appendChild(svg);
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
const K = { neon: { c: '#3CFF3C', w: 2 }, call: { c: '#3CFF3C', w: 1.5 }, white: { c: '#FFFFFF', w: 3 } };

for (const d of focusPaths) el('path', { d, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 2, 'stroke-linecap': 'square' });
// the spine: the swap's path, white and glowing, with ruler ticks
el('line', { x1: SP, y1: SPINE_TOP, x2: SP, y2: SPINE_BOT, stroke: '#FFFFFF', 'stroke-width': 3, filter: 'url(#glow)' });
for (let t = SPINE_TOP + 20; t < SPINE_BOT - 10; t += 20) el('line', { x1: SP - 6, y1: t, x2: SP - 12, y2: t, stroke: 'rgba(255,255,255,.28)', 'stroke-width': 1 });

for (const l of lines) {
  const k = K[l.kind];
  const [a, b] = l.pts;
  let bx = b[0];
  if (l.head) {
    const dx = Math.sign(b[0] - a[0]), HL = 11, hw = 6;
    bx = b[0] - dx * HL;
    el('path', { d: `M${b[0]} ${b[1]}L${bx} ${b[1] - hw}L${bx} ${b[1] + hw}Z`, fill: k.c });
  }
  el('line', { x1: a[0], y1: a[1], x2: bx, y2: b[1], stroke: k.c, 'stroke-width': k.w, 'stroke-dasharray': l.dash ? '7 6' : 'none',
    filter: l.kind === 'white' ? 'url(#glowS)' : 'none' });
}
// nodes: a crosshair square on the spine for every step
for (const n of nodes) {
  const c = n.kind === 'white' ? '#FFFFFF' : '#3CFF3C';
  el('rect', { x: SP - 9, y: n.y - 9, width: 18, height: 18, fill: '#000', stroke: c, 'stroke-width': 2, filter: n.kind === 'white' ? 'url(#glowS)' : 'none' });
  el('rect', { x: SP - 3.5, y: n.y - 3.5, width: 7, height: 7, fill: c });
}

/* ---------- checks ---------- */
window.figureCheck = () => {
  const out = [];
  const boxes = [...fig.querySelectorAll('[data-role="block"],[data-role="subject"],.colhead,.corner,.slash,.eyebrow,.sub,.hd')].map(e => ({ e, r: R(e) }));
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const A = boxes[i].r, B = boxes[j].r;
    if (boxes[i].e.contains(boxes[j].e) || boxes[j].e.contains(boxes[i].e)) continue;
    const ov = Math.min(A.r, B.r) - Math.max(A.x, B.x), oh = Math.min(A.b, B.b) - Math.max(A.y, B.y);
    if (ov > .5 && oh > .5) out.push(`overlap: "${boxes[i].e.textContent.trim().slice(0, 24)}" x "${boxes[j].e.textContent.trim().slice(0, 24)}"`);
  }
  for (const b of boxes) {
    if (b.r.x < PX - 2.5 || b.r.r > W - PX + .5 || b.r.y < 0 || b.r.b > H - 30) out.push(`off-canvas: "${b.e.textContent.trim().slice(0, 24)}"`);
    if (b.e.dataset.role === 'block' && (b.r.x < SP + 20 && b.r.r > SP - 20)) out.push(`block crosses spine: "${b.e.textContent.trim().slice(0, 24)}"`);
  }
  const walker = document.createTreeWalker(fig, NodeFilter.SHOW_TEXT);
  let n; while ((n = walker.nextNode())) { if (!n.textContent.trim()) continue; const fs = parseFloat(getComputedStyle(n.parentElement).fontSize); if (fs < 17.5) out.push(`small text ${fs}: ${n.textContent}`); }
  if (/·/.test(fig.textContent)) out.push('middle dot found');
  return { problems: out, H };
};
})();
</script>
</body></html>
