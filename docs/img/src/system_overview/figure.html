<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<title>Hermit at a glance</title>
<style>
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --bg:#FFFFFF; --panel:#F7F7F9; --card:#FFFFFF; --ink:#1F1E24; --ink2:#5E5C68; --ink3:#8E8C99; --line:#ECEBF0; --line2:#DCDAE3;
  --dev:#4D1D95; --dev-wash:#F6F2FD; --dev-tile:#EDE5FB;
  --near:#0E9F6E; --near-wash:#EAF8F2; --near-ink:#0A6B4B;
  --amber:#C47F0E; --amber-wash:#FFF5E3; --amber-ink:#8A5806; --badge-ink:#FFFFFF;
  --ok:#2F8F5B; --bad:#C2413A;
  --shadow: 0 1px 2px rgba(31,30,36,.06), 0 8px 24px -6px rgba(31,30,36,.10);
  --mark: #4D1D95;
}
[data-theme=dark] {
  --bg:#0F0E12; --panel:#16141B; --card:#1C1A22; --ink:#F4F3F7; --ink2:#B3B0BE; --ink3:#7D7A88; --line:#25232C; --line2:#34313D;
  --dev:#A884EE; --dev-wash:#1E1830; --dev-tile:#2A2140;
  --near:#3DD598; --near-wash:#10261D; --near-ink:#6BE3B1;
  --amber:#F0B44C; --amber-wash:#2A2010; --amber-ink:#F5C877; --badge-ink:#1A1206;
  --ok:#62C892; --bad:#F07A70;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -8px rgba(0,0,0,.55);
  --mark: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: transparent; }
body { width: 1200px; background: transparent; color: var(--ink); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#fig { position: relative; width: 1200px; background: var(--bg); border-radius: 28px; overflow: hidden; }
.abs { position: absolute; }
svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.eyebrow { display: flex; align-items: center; gap: 10px; font: 500 14px/20px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.eyebrow svg { width: 31px; height: 20px; }
h1 { font: 600 32px/40px 'Geist'; letter-spacing: -.02em; color: var(--ink); }
.sub { font: 400 17px/24px 'Geist'; color: var(--ink2); }
.legend { display: grid; grid-template-columns: 40px auto; column-gap: 12px; row-gap: 8px; align-items: center; font: 500 15px/20px 'Geist'; color: var(--ink2); }
.legend svg { width: 40px; height: 12px; overflow: visible; }

/* device */
.device { border: 2px solid var(--dev); background: var(--dev-wash); border-radius: 28px; }
.tag { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; background: var(--bg); border-radius: 10px;
  font: 600 15px/20px 'Geist'; color: var(--dev); white-space: nowrap; }
.tag svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tag.out { color: var(--ink2); padding-left: 0; }
.band { font: 500 14px/18px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); white-space: nowrap; }
.band.dev { color: var(--dev); opacity: .8; }

/* chips */
.chip { height: 30px; padding: 0 10px; border-radius: 15px; background: var(--panel); border: 1px solid var(--line2);
  font: 500 15px/28px 'Geist'; color: var(--ink2); white-space: nowrap; text-align: center; }
.chip.chat { background: var(--card); color: var(--ink); font-weight: 600; border-color: var(--ink3); box-shadow: var(--shadow); }
.chip.acct { background: var(--card); color: var(--ink); }
.chip.acct.near { background: var(--near-wash); border-color: var(--near); color: var(--near-ink); }
.you { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 15px/18px 'Geist'; color: var(--ink2); }
.you .tile { width: 40px; height: 40px; border-radius: 20px; background: var(--card); border: 1px solid var(--line2); display: grid; place-items: center; color: var(--ink); box-shadow: var(--shadow); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow);
  padding: 0 14px; display: flex; flex-direction: column; justify-content: center; }
.card .row { display: flex; align-items: center; gap: 12px; }
.card .ti { width: 40px; height: 40px; flex: none; border-radius: 11px; background: var(--panel); border: 1px solid var(--line2); display: grid; place-items: center; color: var(--ink); }
.card .tx { display: flex; flex-direction: column; min-width: 0; }
.card b { font: 600 19px/24px 'Geist'; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.card span { font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.card code { font: 450 13.5px/18px 'Geist Mono'; letter-spacing: -.03em; color: var(--ink3); white-space: nowrap; margin-top: 10px; display: block; }
.card.money { background: var(--amber-wash); border: 1.5px solid var(--amber); }
.card.money b { color: var(--amber-ink); }
.card.money .ti { background: var(--card); border-color: color-mix(in srgb, var(--amber) 45%, transparent); color: var(--amber); }
.card.near { background: var(--near-wash); border: 1.5px solid var(--near); }
.card.near b { color: var(--near-ink); }
.card.near .ti { background: var(--card); border-color: color-mix(in srgb, var(--near) 45%, transparent); color: var(--near); }
.card.vault .ti { background: var(--dev-tile); border-color: color-mix(in srgb, var(--dev) 40%, transparent); color: var(--dev); }
.card.mode b { margin-bottom: 8px; }
.seg { display: flex; height: 30px; font: 500 15px/20px 'Geist'; }
.seg div { display: flex; align-items: center; padding: 0 12px; white-space: nowrap; }
.seg .on { background: var(--ink); color: var(--bg); border-radius: 15px 0 0 15px; border: 1.5px solid var(--ink); }
.seg .pc { color: var(--dev); border: 1.5px dashed var(--dev); border-left: none; border-radius: 0 15px 15px 0; background: var(--card); }

/* outside */
.panel { background: var(--panel); border-radius: 22px; }
.panel .pe { position: absolute; left: 16px; top: 14px; font: 500 14px/18px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); white-space: nowrap; }
.panel.nearp .pe { color: var(--near-ink); }
.list { background: var(--card); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.list .li { position: absolute; left: 0; right: 0; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; }
.list .li + .li { border-top: 1px solid var(--line); }
.list b { font: 600 19px/24px 'Geist'; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.list span { font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }

/* lines */
svg#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 2; }
.device { z-index: 0; } .panel { z-index: 1; } .card, .list, .chip, .you, .tag, .band, .note { z-index: 3; } .pill { z-index: 4; }
.w { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.w.neu { stroke: var(--ink3); stroke-width: 2; }
.w.money { stroke: var(--amber); stroke-width: 2.5; }
.w.near { stroke: var(--near); stroke-width: 2; }
.w.dev { stroke: var(--dev); stroke-width: 2; }
.w.dash { stroke-dasharray: 6 5; stroke-linecap: butt; }
.hd.neu { fill: var(--ink3); } .hd.money { fill: var(--amber); } .hd.near { fill: var(--near); } .hd.dev { fill: var(--dev); }
.hop { stroke-width: 10; fill: none; stroke-linecap: butt; }
.pill { position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 8px; font: 500 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; text-align: center; }
.pill.on-bg { background: var(--bg); } .pill.on-dev { background: var(--dev-wash); } .pill.on-panel { background: var(--panel); }
.pill.money { color: var(--amber-ink); } .pill.near { color: var(--near-ink); } .pill.dev { color: var(--dev); }
.card.sm .ti { width: 32px; height: 32px; border-radius: 9px; } .card.sm .ti svg { width: 18px; height: 18px; } .card.sm .row { gap: 10px; }
.acctbox { border: 1px solid var(--line2); border-radius: 16px; background: var(--panel); z-index: 2; }
.chip.acct { line-height: 26px; height: 28px; border-radius: 14px; z-index: 3; }
.pill.two { line-height: 18px; padding: 4px 8px; }
.note { font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
</style></head>
<body><div id="fig"></div>
<script>
const theme = new URLSearchParams(location.search).get('theme') || 'light';
document.documentElement.dataset.theme = theme;

// ---------- icons (24 grid, stroke 1.6, round) ----------
const I = {
  person: '<circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.6-3.9 3.6-6.4 7.2-6.4s6.6 2.5 7.2 6.4"/>',
  chat: '<path d="M4.5 5.5h15a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.5V17h-2A1.5 1.5 0 0 1 3 15.5V7a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M7.5 10h9M7.5 13h5.5"/>',
  chip: '<rect x="6" y="6" width="12" height="12" rx="2.2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"/>',
  wrench: '<path d="M14.5 4.2a4.6 4.6 0 0 0-5.6 6L3.8 15.3a1.9 1.9 0 0 0 0 2.7l2.2 2.2a1.9 1.9 0 0 0 2.7 0l5.1-5.1a4.6 4.6 0 0 0 6-5.6l-2.9 2.9-2.8-.7-.7-2.8z"/>',
  shield: '<path d="M12 3.2 19 6v5.2c0 4.3-2.9 7.9-7 9.6-4.1-1.7-7-5.3-7-9.6V6z"/><path d="m9 12 2.2 2.2L15.2 10"/>',
  gauge: '<path d="M4.2 16.5a8 8 0 1 1 15.6 0"/><path d="M12 15.5 15.5 10"/><circle cx="12" cy="15.5" r="1.3"/><path d="M6.8 11.2l1 .6M12 7.2V8.4M17.2 11.2l-1 .6"/>',
  faceid: '<path d="M4 8.5V6.2A2.2 2.2 0 0 1 6.2 4h2.3M15.5 4h2.3A2.2 2.2 0 0 1 20 6.2v2.3M20 15.5v2.3a2.2 2.2 0 0 1-2.2 2.2h-2.3M8.5 20H6.2A2.2 2.2 0 0 1 4 17.8v-2.3"/><path d="M9 9.2v1.3M15 9.2v1.3M12.3 9.2v3.6h-1M9.4 15.3c1.5 1.2 3.7 1.2 5.2 0"/>',
  enclave: '<rect x="5" y="5" width="14" height="14" rx="2.6"/><path d="M9 2.8V5M15 2.8V5M9 19v2.2M15 19v2.2M2.8 9H5M2.8 15H5M19 9h2.2M19 15h2.2"/><rect x="9.2" y="11.3" width="5.6" height="4.4" rx="1"/><path d="M10.3 11.3V10a1.7 1.7 0 0 1 3.4 0v1.3"/>',
  key: '<circle cx="8" cy="15.5" r="3.8"/><path d="M10.8 12.8 19.5 4M16.5 7l2.3 2.3M14.2 9.3l1.8 1.8"/>',
  cloudlock: '<path d="M7 18.5a4.2 4.2 0 0 1-.7-8.3 5.8 5.8 0 0 1 11.2-1 4.6 4.6 0 0 1 .3 9.3z"/><rect x="9.6" y="12.6" width="4.8" height="3.8" rx=".9"/><path d="M10.6 12.6v-1a1.4 1.4 0 0 1 2.8 0v1"/>',
  cross: '<path d="M4 7h3.2c2.8 0 4 1.8 4.8 5s2 5 4.8 5H20M17 14l3 3-3 3M4 17h3.2c1.4 0 2.4-.5 3.1-1.3M13.7 8.3c.7-.8 1.7-1.3 3.1-1.3H20M17 4l3 3-3 3"/>',
  link: '<path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l3.1-3.1a3.6 3.6 0 0 0-5.1-5.1l-1.2 1.2"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.1 0l-3.1 3.1a3.6 3.6 0 0 0 5.1 5.1l1.2-1.2"/>',
  globe: '<circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.4 2.4 3.6 5.3 3.6 8.6s-1.2 6.2-3.6 8.6c-2.4-2.4-3.6-5.3-3.6-8.6S9.6 5.8 12 3.4z"/>',
  download: '<path d="M12 4v10.5M7.8 10.6 12 14.8l4.2-4.2M4.5 15.5v2.3A2.2 2.2 0 0 0 6.7 20h10.6a2.2 2.2 0 0 0 2.2-2.2v-2.3"/>',
  phone: '<rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.6 5.4h2.8"/>',
  mac: '<rect x="4.2" y="5" width="15.6" height="10.6" rx="1.6"/><path d="M2.2 19h19.6"/>',
};
const ico = (k, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24">${I[k]}</svg>`;
const MARK = `<svg viewBox="0 0 171.8 110"><g fill="none" stroke="var(--mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h161.8v100H5zM105 5v100M105 66.8h61.8M128.6 66.8V105M105 81.4h23.6M119.6 66.8v14.6M5 105A100 100 0 0 1 105 5a61.8 61.8 0 0 1 61.8 61.8 38.2 38.2 0 0 1-38.2 38.2 23.6 23.6 0 0 1-23.6-23.6 14.6 14.6 0 0 1 14.6-14.6"/></g></svg>`;

async function build() {
await Promise.all([document.fonts.load("500 15px Geist"), document.fonts.load("600 19px Geist"), document.fonts.load("400 15px Geist"), document.fonts.load("450 13.5px 'Geist Mono'"), document.fonts.load("500 14px 'Geist Mono'")]);
await document.fonts.ready;
const fig = document.getElementById('fig');
const R = {};   // rects by id (figure coordinates)
function el(html, x, y, w, h, id, cls = '') {
  const d = document.createElement('div');
  d.className = 'abs ' + cls; d.style.left = x + 'px'; d.style.top = y + 'px';
  if (w != null) d.style.width = w + 'px'; if (h != null) d.style.height = h + 'px';
  d.innerHTML = html; if (id) d.id = id;
  fig.appendChild(d);
  if (id) { R[id] = { x, y, w: w ?? d.offsetWidth, h: h ?? d.offsetHeight }; }
  return d;
}
function card(id, x, y, w, h, icon, label, sub, file, cls = '') {
  el(`<div class="row"><div class="ti">${ico(icon)}</div><div class="tx"><b>${label}</b><span>${sub}</span></div></div>${file ? `<code>${file}</code>` : ''}`,
    x, y, w, h, id, 'card ' + cls);
}

// ---------- geometry ----------
const DEV = { x: 64, y: 216, w: 644 };                 // device boundary, right edge 708
const DX = DEV.x + DEV.w;
const L = { x: 80, w: 256 }, RC = { x: 434, w: 258 };   // inner columns (gap 98)
const OUT = { x: 852, w: 272 };                         // outside column
const CX = OUT.x + 10, CW = OUT.w - 20;                 // 862..1114

// header
el(`<div class="eyebrow">${MARK}<span>Hermit / system overview</span></div>`, 64, 56, null, null, 'eyebrow');
el(`<h1>Hermit at a glance</h1>`, 64, 88, null, null, 'title');
el(`<div class="sub">Everything that thinks, decides and signs runs on your device.</div>`, 64, 136, null, null, 'subtitle');
el(`<div class="legend">
  <svg viewBox="0 0 40 12"><path d="M1 6h38" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round"/></svg><span>Moves money</span>
  <svg viewBox="0 0 40 12"><path d="M1 6h38" stroke="var(--near)" stroke-width="2" stroke-linecap="round"/></svg><span>NEAR</span>
  <svg viewBox="0 0 40 12"><path d="M1 6h38" stroke="var(--ink3)" stroke-width="2" stroke-dasharray="6 5"/></svg><span>Private Cloud or read only</span>
</div>`, 852, 60, null, null, 'legend');

// ---------- band A: app ----------
el('App', L.x, 244, null, null, 'bandA', 'band dev');
const midA = 329;
el(`<div class="tile">${ico('person')}</div><span>You</span>`, L.x, midA - 20, 40, null, 'you', 'you');
R.youTile = { x: L.x, y: midA - 20, w: 40, h: 40 };
el('Chat', 192, midA - 15, null, 30, 'chat', 'chip chat');
[['Wallets', 'Trade', 'Earn', 'Payments'], ['Explore and browser', 'Automations'], ['Projects', 'Calendar', 'Settings']].forEach((row, i) => {
  let cx = 300; for (const t of row) { const d = el(t, cx, 276 + i * 38, null, 30, null, 'chip'); cx += d.offsetWidth + 8; }
});

// ---------- band B: assistant ----------
const B1 = 448, BH = 112, B2 = 624;
el('Assistant', L.x, B1 - 28, null, null, 'bandB', 'band dev');
el(`<b>Mode switch</b><div class="seg"><div class="on">On-device</div><div class="pc">Private Cloud</div></div><code>HermitUI/Cloud/PrivateCloud.swift</code>`,
  L.x, B1, 282, BH, 'mode', 'card mode');
card('enc', RC.x, B1, RC.w, BH, 'shield', 'Enclave check', 'Proof before any prompt', 'HermitCloud/Attestation.swift');
card('model', L.x, B2, L.w, BH, 'chip', 'Hermit 1.2 model', 'On device, MLX 4-bit', 'HermitModel/ModelCatalog.swift');
card('loop', RC.x, B2, RC.w, BH, 'wrench', 'Tool loop', '30 tools, guarded', 'HermitCore/ToolLoop.swift');
const CH = B2 + BH + 24;
card('chats', L.x, CH, L.w, 72, 'chat', 'Chats stay here', 'Saved on this device', null);

// ---------- band C: money path ----------
const yElbow = CH + 72 + 26;                 // TL -> policy runs under the chats card
const C1 = yElbow + 40, C2 = C1 + BH + 48;
el('Money path', L.x, C1 - 28, null, null, 'bandC', 'band dev');
card('policy', L.x, C1, L.w, BH, 'gauge', 'Spending policy', 'Limits before any review', 'HermitWallet/SpendPolicy.swift', 'money');
card('review', RC.x, C1, RC.w, BH, 'faceid', 'Review and Face ID', 'You approve every move', 'HermitUI/ApprovalSheet.swift', 'money');
card('vault', RC.x, C2, RC.w, BH, 'enclave', 'Key vault', 'Sealed by Secure Enclave', 'HermitWallet/KeyVault.swift', 'vault');
const AC = { x: L.x, y: C2, w: 152, h: BH };
el('', AC.x, AC.y, AC.w, AC.h, 'accts', 'acctbox');
el('EVM account', AC.x + 10, AC.y + 10, AC.w - 20, 28, 'aevm', 'chip acct');
el('Solana account', AC.x + 10, AC.y + 42, AC.w - 20, 28, 'asol', 'chip acct');
el('NEAR account', AC.x + 10, AC.y + 74, AC.w - 20, 28, 'anear', 'chip acct near');
const yBus = C2 + BH + 22;
const DEVB = yBus + 22;
DEV.h = DEVB - DEV.y;
el('', DEV.x, DEV.y, DEV.w, DEV.h, 'device', 'device');
el(`${ico('phone')}${ico('mac')}<span>On your iPhone or Mac</span>`, DEV.x + 22, DEV.y - 15, null, null, 'tag', 'tag');
el('No Hermit server, no account, no analytics. Nothing syncs to iCloud.', DEV.x + 4, DEVB + 16, null, null, 'note', 'note');

// ---------- outside ----------
el(`${ico('globe')}<span>Outside your device</span>`, OUT.x, DEV.y - 15, null, null, 'tagout', 'tag out');
function panel(id, y, h, name, cls = '') { el(`<div class="pe">${name}</div>`, OUT.x, y, OUT.w, h, id, 'panel ' + cls); }
function list(id, y, rows, rh) {
  const d = el('', CX, y, CW, rows.length * rh, id, 'list');
  rows.forEach(([k, b, s], i) => {
    const r = document.createElement('div'); r.className = 'li'; r.id = k; r.style.top = (i * rh) + 'px'; r.style.height = rh + 'px';
    r.innerHTML = `<b>${b}</b><span>${s}</span>`; d.appendChild(r); R[k] = { x: CX, y: y + i * rh, w: CW, h: rh };
  });
}
const RH = 58;
// NEAR AI Cloud spans the enclave check's lower edge and the tool loop's upper edge, so both lines run straight
const yCloudIn = B1 + BH - 20, yCloudOut = B2 + 20;
const cloudTop = yCloudIn - 22, cloudH = yCloudOut + 22 - cloudTop;
const NY = cloudTop - 44;
const PY = 240, PH = NY - 14 - PY;
panel('pP', PY, PH, 'Public services');
const prh = Math.floor((PH - 44 - 10) / 3);
list('lP', PY + 44, [['nras', 'NVIDIA NRAS', 'GPU evidence only'], ['dl', 'Model download', 'models.hermit.my, Hugging Face'], ['data', 'Public data', 'Prices, yields, history, RPCs']], prh);
card('cloud', CX, cloudTop, CW, cloudH, 'cloudlock', 'NEAR AI Cloud', 'TEE gateway and model', null, 'near sm');
const yQuote = B2 + BH - 22;
card('intents', CX, yQuote - 32, CW, 64, 'cross', 'NEAR Intents 1Click', 'Signed quotes, solvers fill', null, 'near sm');
card('nearc', CX, yQuote + 32 + 10, CW, 64, 'link', 'NEAR', 'Your implicit account', null, 'near sm');
const NH = R.nearc.y + 64 + 10 - NY;
panel('pN', NY, NH, 'NEAR', 'nearp');
const CY = NY + NH + 14;
panel('pC', CY, 44 + 5 * RH + 10, 'Chains and venues');
list('lC', CY + 44, [['evm', 'EVM chains', 'Ethereum, Base, Arbitrum, more'], ['sol', 'Solana', 'Spot through Jupiter'], ['hl', 'Hyperliquid', 'Perps, your own account'], ['btc', 'Bitcoin', 'Payout only, via 1Click'], ['routes', 'Relay, Aave v3', 'Bridges, Earn deposits']], RH);
const H = Math.max(CY + 44 + 5 * RH + 10, DEVB + 16 + 20) + 56;
fig.style.height = H + 'px';

// ---------- wires ----------
const svgNS = 'http://www.w3.org/2000/svg';
const wires = document.createElementNS(svgNS, 'svg'); wires.id = 'wires';
wires.setAttribute('width', 1200); wires.setAttribute('height', H);
fig.appendChild(wires);
const g = (tag, attrs) => { const e = document.createElementNS(svgNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); wires.appendChild(e); return e; };
const rt = (id, f = .5) => [R[id].x + R[id].w, R[id].y + R[id].h * f];
const lf = (id, f = .5) => [R[id].x, R[id].y + R[id].h * f];
const tp = (id, f = .5) => [R[id].x + R[id].w * f, R[id].y];
const bt = (id, f = .5) => [R[id].x + R[id].w * f, R[id].y + R[id].h];
const midY = id => R[id].y + R[id].h / 2;
const FR = fig.getBoundingClientRect();
const box = sel => { const r = fig.querySelector(sel).getBoundingClientRect(); return { x: r.left - FR.left, y: r.top - FR.top, w: r.width, h: r.height }; };

function roundPath(pts, r = 12) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = x1 - (x1 - x0) / l1 * rr, ay = y1 - (y1 - y0) / l1 * rr;
    const bx = x1 + (x2 - x1) / l2 * rr, by = y1 + (y2 - y1) / l2 * rr;
    d += ` L${ax} ${ay} Q${x1} ${y1} ${bx} ${by}`;
  }
  const p = pts[pts.length - 1]; d += ` L${p[0]} ${p[1]}`; return d;
}
const WIRES = window.WIRES = [];
function wire(pts, style, { dash = false, head = true } = {}) {
  const P = pts.map(p => [...p]); const AH = 9;
  let headSeg = null;
  if (head) { const a = P[P.length - 2], b = [...P[P.length - 1]]; const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    P[P.length - 1] = [b[0] - (b[0] - a[0]) / l * (AH - 1), b[1] - (b[1] - a[1]) / l * (AH - 1)]; headSeg = [a, b]; }
  g('path', { d: roundPath(P), class: `w ${style}${dash ? ' dash' : ''}` });
  if (headSeg) {
    const [a, b] = headSeg; const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const tri = [[0, 0], [-AH, -AH / 2 - .5], [-AH, AH / 2 + .5]].map(([x, y]) => [b[0] + x * Math.cos(ang) - y * Math.sin(ang), b[1] + x * Math.sin(ang) + y * Math.cos(ang)]);
    g('path', { d: `M${tri.map(p => p.map(v => v.toFixed(2)).join(' ')).join(' L')} Z`, class: `hd ${style}` });
  }
  WIRES.push({ pts, style });
}
function hop(x, y, vertical = true, bgVar = '--bg') { const s = 7;
  g('path', { d: vertical ? `M${x} ${y - s} V${y + s}` : `M${x - s} ${y} H${x + s}`, class: 'hop', stroke: `var(${bgVar})` }); }
function pill(text, x, y, cls = 'on-bg') { return el(text, x, y, null, null, null, 'pill ' + cls); }

// --- band A
wire([[R.youTile.x + 40, midA], [R.chat.x, midA]], 'neu'); pill('ask', (R.youTile.x + 40 + R.chat.x) / 2, midA, 'on-dev');
// --- band B
const chatX = R.chat.x + R.chat.w / 2;
wire([[chatX, R.chat.y + R.chat.h], [chatX, B1]], 'neu');                               // Chat -> Mode switch
const sOn = box('#mode .on'), sPc = box('#mode .pc');
const segY = sPc.y + sPc.h / 2, onX = sOn.x + sOn.w / 2;
wire([[R.mode.x + R.mode.w, segY], [RC.x, segY]], 'dev', { dash: true });              // Private Cloud -> Enclave check
wire([[onX, B1 + BH], [onX, B2]], 'neu');                                             // On-device -> model
wire([rt('model'), lf('loop')], 'neu'); pill('tool calls', (L.x + L.w + RC.x) / 2, midY('model'), 'on-dev');

// --- corridor
const IN = RC.x + RC.w;            // 692, right edge of the inner cards
const xA = 732, xC = 816, xD = 834;
const yNras = B1 + 24;
const yCh = B1 + BH + 20, yData = B2 - 18;
// Enclave check -> NVIDIA NRAS (dashed: Private Cloud only)
wire([[IN, yNras], [xA, yNras], [xA, midY('nras')], lf('nras')], 'neu', { dash: true });
el('GPU<br>evidence', (xA + CX) / 2 - 4, midY('nras'), null, null, 'pNras', 'pill on-bg two');
// Model download -> model, through the channel between the rows
const xModelIn = R.model.x + R.model.w - 44;
wire([lf('dl'), [xC, midY('dl')], [xC, yCh], [xModelIn, yCh], [xModelIn, B2]], 'neu');
pill('pinned SHA-256, once', (xModelIn + IN) / 2 + 30, yCh, 'on-dev');
// Tool loop -> public data (dashed: read only), out of the loop's top edge
const xLoopUp = IN - 28;
wire([[xLoopUp, B2], [xLoopUp, yData], [xD, yData], [xD, midY('data')], lf('data')], 'neu', { dash: true });
pill('read only', (DX + xC) / 2 - 2, yData);
// Enclave check -> NEAR AI Cloud, straight, over the two lines that climb to the public services
hop(xC, yCloudIn); hop(xD, yCloudIn);
wire([[IN, yCloudIn], [CX, yCloudIn]], 'near');
el('proof first,<br>then prompt', (DX + xC) / 2 - 1, yCloudIn, null, null, 'pCloudIn', 'pill on-bg near two');
// NEAR AI Cloud -> tool loop (dashed: Private Cloud only)
wire([[CX, yCloudOut], [IN, yCloudOut]], 'near', { dash: true });
el('tool calls<br>run here', (DX + xC) / 2 - 1, yCloudOut, null, null, 'pCloudOut', 'pill on-bg near two');
// Tool loop -> 1Click quotes
wire([[IN, yQuote], [CX, yQuote]], 'near'); pill('quotes', (DX + CX) / 2, yQuote, 'on-bg near');

// --- money path (amber)
const xPolicyIn = R.policy.x + R.policy.w - 56;
wire([bt('loop'), [R.loop.x + R.loop.w / 2, yElbow], [xPolicyIn, yElbow], [xPolicyIn, C1]], 'money');
pill('prepare only', (R.loop.x + R.loop.w / 2 + xPolicyIn) / 2, yElbow, 'on-dev money');
wire([rt('policy'), lf('review')], 'money'); pill('allowed', (L.x + L.w + RC.x) / 2, midY('policy'), 'on-dev money');
wire([bt('review'), tp('vault')], 'money'); pill('Face ID', R.review.x + R.review.w / 2, (C1 + BH + C2) / 2, 'on-dev money');
wire([lf('vault'), [AC.x + AC.w, midY('vault')]], 'money'); pill('derive, sign', (AC.x + AC.w + RC.x) / 2, midY('vault'), 'on-dev money');
// one bus out of the device: signed transactions
const xTrunk = 826;
const busTargets = ['nearc', 'evm', 'sol', 'hl'];
const yTop = midY('nearc');
g('path', { d: roundPath([[AC.x + AC.w / 2, AC.y + AC.h], [AC.x + AC.w / 2, yBus], [xTrunk, yBus], [xTrunk, yTop + 12]]) + '', class: 'w money' });
for (const t of busTargets) {
  const y = midY(t);
  if (t === 'nearc') wire([[xTrunk, y + 12], [xTrunk, y], [CX, y]], 'money');
  else wire([[xTrunk - 0.01, y], [CX, y]], 'money');
}
WIRES.push({ pts: [[AC.x + AC.w / 2, AC.y + AC.h], [AC.x + AC.w / 2, yBus], [xTrunk, yBus], [xTrunk, yTop]], style: 'money' });
pill('signed transactions', 470, yBus, 'on-dev money');

// --- 1Click settles (green), down the right-hand lane into every chain it can pay out on
const xLane = 1158;
const settle = ['nearc', 'evm', 'sol', 'hl', 'btc'];
const yLast = midY('btc');
g('path', { d: roundPath([[CX + CW, yQuote], [xLane, yQuote], [xLane, yLast - 12]]), class: 'w near' });
for (const t of settle) {
  const y = midY(t);
  if (t === 'btc') wire([[xLane, y - 12], [xLane, y], [CX + CW, y]], 'near');
  else wire([[xLane + 0.01, y], [CX + CW, y]], 'near');
}
WIRES.push({ pts: [[CX + CW, yQuote], [xLane, yQuote], [xLane, yLast]], style: 'near' });
pill('settles', xLane, (yQuote + midY('nearc')) / 2, 'on-bg near');

}
window.figureCheck = () => {
      const out = { problems: [] };
      const fig = document.getElementById('fig'); const F = fig.getBoundingClientRect();
      const texts = [];
      const walker = document.createTreeWalker(fig, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const n = walker.currentNode; if (!n.textContent.trim()) continue;
        const r = document.createRange(); r.selectNodeContents(n); const rc = r.getBoundingClientRect();
        const fs = parseFloat(getComputedStyle(n.parentElement).fontSize);
        texts.push({ t: n.textContent.trim(), x: rc.left - F.left, y: rc.top - F.top, w: rc.width, h: rc.height, fs, el: n.parentElement });
      }
      for (const t of texts) {
        if (t.fs < 13.5) out.problems.push('small ' + t.fs + ' ' + t.t);
        if (t.x < 0 || t.y < 0 || t.x + t.w > 1200 || t.y + t.h > F.height) out.problems.push('off ' + t.t);
        const isLabel = t.el.closest('.card,.list,.chip,.pill,.tag,.band,.legend');
        if (isLabel && t.t.split(/\s+/).length > 5 && !t.el.closest('code')) out.problems.push('words ' + t.t);
      }
      for (let i = 0; i < texts.length; i++) for (let j = i + 1; j < texts.length; j++) {
        const a = texts[i], c = texts[j];
        if (a.x < c.x + c.w - 1 && c.x < a.x + a.w - 1 && a.y < c.y + c.h - 1 && c.y < a.y + a.h - 1) out.problems.push('text overlap: ' + a.t + ' | ' + c.t);
      }
      // boxes: cards, chips, pills, list rows must not overlap each other (except nesting)
      const boxes = [...fig.querySelectorAll('.card,.chip,.pill,.list,.you,.tag,.legend,.note,.band,h1,.sub,.eyebrow,.panel')].map(e => { const r = e.getBoundingClientRect(); return { e, x: r.left - F.left, y: r.top - F.top, w: r.width, h: r.height }; });
      for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
        const a = boxes[i], c = boxes[j];
        if (a.e.contains(c.e) || c.e.contains(a.e)) continue;
        if (a.e.classList.contains('panel') || c.e.classList.contains('panel')) { // panels may hold cards; only flag pills/text over panels' outside
          continue; }
        if (a.x < c.x + c.w - .5 && c.x < a.x + a.w - .5 && a.y < c.y + c.h - .5 && c.y < a.y + a.h - .5)
          out.problems.push('box overlap: ' + (a.e.id || a.e.className) + ' "' + a.e.textContent.trim().slice(0, 24) + '" | ' + (c.e.id || c.e.className) + ' "' + c.e.textContent.trim().slice(0, 24) + '"');
      }
      // wires vs cards: segment must not pass through a card interior (inset 2px)
      const solid = [...fig.querySelectorAll('.card,.list,.chip,.you .tile,.pill:not(.skip)')].map(e => { const r = e.getBoundingClientRect(); return { e, x: r.left - F.left + 2, y: r.top - F.top + 2, w: r.width - 4, h: r.height - 4 }; });
      for (const w of (window.WIRES || [])) {
        for (let k = 0; k < w.pts.length - 1; k++) {
          const [x0, y0] = w.pts[k], [x1, y1] = w.pts[k + 1];
          for (const s of solid) {
            if (s.e.classList.contains('pill')) continue;
            const minx = Math.min(x0, x1), maxx = Math.max(x0, x1), miny = Math.min(y0, y1), maxy = Math.max(y0, y1);
            if (maxx > s.x && minx < s.x + s.w && maxy > s.y && miny < s.y + s.h) out.problems.push('wire through ' + (s.e.id || s.e.className) + ' "' + s.e.textContent.trim().slice(0, 20) + '" seg ' + [x0, y0, x1, y1].map(Math.round));
          }
        }
      }
      return out;
};
