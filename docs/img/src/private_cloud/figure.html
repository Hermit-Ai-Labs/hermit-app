<!doctype html>
<html data-theme="light"><head><meta charset="utf-8">
<title>Private Cloud: proof first</title>
<style>
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --bg:#FFFFFF; --panel:#F7F7F9; --card:#FFFFFF; --ink:#1F1E24; --ink2:#5E5C68; --ink3:#8E8C99; --line:#ECEBF0; --line2:#DCDAE3;
  --dev:#4D1D95; --dev-wash:#F6F2FD; --mark:#4D1D95;
  --near:#0E9F6E; --near-wash:#EAF8F2; --near-ink:#0A6B4B;
  --amber:#C47F0E; --amber-wash:#FFF5E3; --amber-ink:#8A5806;
  --ok:#2F8F5B; --bad:#C2413A; --bad-wash:#FCEEED;
  --badge-ink:#FFFFFF;
  --shadow: 0 1px 2px rgba(31,30,36,.06), 0 8px 24px -6px rgba(31,30,36,.10);
}
[data-theme=dark] {
  --bg:#0F0E12; --panel:#16141B; --card:#1C1A22; --ink:#F4F3F7; --ink2:#B3B0BE; --ink3:#7D7A88; --line:#25232C; --line2:#34313D;
  --dev:#A884EE; --dev-wash:#1E1830; --mark:#FFFFFF;
  --near:#3DD598; --near-wash:#10261D; --near-ink:#6BE3B1;
  --amber:#F0B44C; --amber-wash:#2A2010; --amber-ink:#F5C877;
  --ok:#62C892; --bad:#F07A70; --bad-wash:#2C1614;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -8px rgba(0,0,0,.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
.mono, .fr, .eyebrow, .ph, .gh, .nb { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
html { background: transparent; }
body::before { content: ''; position: absolute; inset: 0; border-radius: 28px; background: var(--bg); z-index: -1; }
body { position: relative; isolation: isolate; width: 1200px; background: none; color: var(--ink); border-radius: 28px;
  overflow: hidden; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
svg.layer { position: absolute; left: 0; top: 0; width: 1200px; overflow: visible; pointer-events: none; }
svg.layer#back { z-index: 0; } svg.layer#front { z-index: 4; }

/* header */
.eyebrow { left: 64px; top: 56px; display: flex; align-items: center; gap: 10px; height: 20px;
  font: 500 14px/20px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); white-space: nowrap; }
.eyebrow svg { width: 31px; height: 20px; }
h1 { position: absolute; left: 64px; top: 88px; font: 600 32px/40px 'Geist'; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
.sub { left: 64px; top: 136px; font: 400 17px/24px 'Geist'; color: var(--ink2); white-space: nowrap; }

/* device tag */
.tag { height: 30px; padding: 0 12px 0 10px; border-radius: 10px; background: var(--bg); z-index: 3;
  display: flex; align-items: center; gap: 8px; font: 600 15px/20px 'Geist'; color: var(--dev); white-space: nowrap; }
.tag svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.peb { z-index: 3; display: flex; align-items: center; gap: 8px; font: 500 14px/20px 'Geist Mono'; letter-spacing: .08em;
  text-transform: uppercase; color: var(--near-ink); white-space: nowrap; }
.peb svg { width: 18px; height: 18px; }

/* cards */
.card { position: absolute; z-index: 2; background: var(--card); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow); }
.lab { font: 600 19px/24px 'Geist'; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.sl { font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.fr { font: 450 13.5px/18px 'Geist Mono'; color: var(--ink3); white-space: nowrap; }
.tile { width: 40px; height: 40px; flex: none; border-radius: 11px; border: 1px solid var(--line2); background: var(--panel);
  display: grid; place-items: center; color: var(--ink2); }
.std { padding: 16px 18px; }
.std .top { display: flex; gap: 14px; align-items: center; }
.std .refs { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }

/* lane headers */
.hdr { padding: 14px 14px 14px; text-align: center; }
.hdr .hl { display: flex; justify-content: center; align-items: center; gap: 8px; }
.hdr .hl svg { width: 20px; height: 20px; color: var(--ink2); }
.hdr .sl { margin-top: 2px; }
.hdr .fr { }
.hdr .refs { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.hdr.near { border: 1.5px solid var(--near); }
.hdr.near .lab { color: var(--near-ink); }
.hdr.near .hl svg { color: var(--near); }
.hdr.dev .hl svg { color: var(--dev); }

/* phase eyebrows */
.ph { z-index: 3; display: flex; align-items: center; gap: 10px; height: 28px; padding-right: 12px; white-space: nowrap; }
.ph .k { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center;
  font: 600 15px/1 'Geist'; }
.ph .n { font: 600 15px/20px 'Geist Mono'; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.ph .d { font: 400 15px/20px 'Geist'; color: var(--ink3); letter-spacing: 0; text-transform: none; }

/* badges */
.badge { position: absolute; z-index: 3; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg);
  font: 600 15px/28px 'Geist'; text-align: center; font-variant-numeric: tabular-nums; }

/* arrow text */
.al { z-index: 3; font: 600 15px/20px 'Geist'; color: var(--ink); white-space: nowrap; }
.al.near { color: var(--near-ink); }
.am { z-index: 3; font: 450 13.5px/20px 'Geist Mono'; color: var(--ink3); white-space: nowrap; }
.as { z-index: 3; font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.pill { z-index: 3; background: var(--bg); border-radius: 8px; padding: 2px 8px; font: 500 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.pill.onnear { background: var(--near-wash); }
.note { z-index: 3; display: flex; align-items: center; gap: 8px; font: 500 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.note svg { width: 18px; height: 18px; color: var(--ink3); }
.inline { display: flex; align-items: baseline; gap: 12px; }

/* connection chip */
.conn { z-index: 3; height: 32px; padding: 0 14px 0 30px; border-radius: 16px; background: var(--bg); border: 1.5px solid var(--near);
  font: 600 15px/29px 'Geist'; color: var(--near-ink); white-space: nowrap; }
.conn::before { content: ''; position: absolute; left: 11px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--near); }

/* checklist */
.chk { padding: 16px 18px 16px; }
.chk .top { display: flex; align-items: center; gap: 12px; }
.chk .top .badge { position: static; }
.chk .cols { margin-top: 14px; display: grid; grid-template-columns: auto auto; column-gap: 12px; }
.gh { font: 500 14px/20px 'Geist Mono'; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); white-space: nowrap; margin-bottom: 6px; }
.ti { display: flex; align-items: flex-start; gap: 8px; font: 400 15px/20px 'Geist'; color: var(--ink); white-space: nowrap; padding: 3px 0; }
.ti svg { width: 16px; height: 16px; margin-top: 2px; color: var(--ok); stroke-width: 2.2; }
.fail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  font: 600 15px/20px 'Geist'; color: var(--bad); white-space: nowrap; }
.fail svg { width: 18px; height: 18px; stroke-width: 1.8; }

/* signature + verified cards */
.sig .ticks { margin-top: 12px; display: grid; grid-template-columns: auto auto; column-gap: 16px; }
.chipv { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border-radius: 14px;
  border: 1.5px solid var(--ok); color: var(--ok); font: 600 15px/26px 'Geist'; white-space: nowrap; }
.chipv svg { width: 16px; height: 16px; stroke-width: 1.8; }
.amberline { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  font: 500 15px/20px 'Geist'; color: var(--amber-ink); white-space: nowrap; }
.amberline svg { width: 18px; height: 18px; color: var(--amber); stroke-width: 1.8; }
.loopnote { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: flex-start; gap: 8px;
  font: 400 15px/20px 'Geist'; color: var(--ink2); white-space: nowrap; }
.loopnote svg { width: 18px; height: 18px; color: var(--ink3); margin-top: 1px; }

/* not checked */
.nc .ncl { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; row-gap: 12px; }
.nci { display: flex; gap: 12px; align-items: flex-start; }
.nci .dash { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.6px dashed var(--ink3); flex: none; }
.nci .t { font: 600 15px/20px 'Geist'; color: var(--ink); white-space: nowrap; }
/* footer */
.foot { z-index: 2; background: var(--panel); border-radius: 16px; padding: 0 22px; display: flex; align-items: center; gap: 18px; white-space: nowrap; }
.foot .gh { margin: 0; }
.foot .it { font: 400 15px/20px 'Geist'; color: var(--ink2); }
.foot .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink3); flex: none; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-enclave" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2.5V5M15 2.5V5M9 19v2.5M15 19v2.5M2.5 9H5M2.5 15H5M19 9h2.5M19 15h2.5"/><rect x="9.25" y="11.5" width="5.5" height="4.25" rx="1"/><path d="M10.5 11.5v-1.25a1.5 1.5 0 0 1 3 0v1.25"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2.5V5M15 2.5V5M9 19v2.5M15 19v2.5M2.5 9H5M2.5 15H5M19 9h2.5M19 15h2.5"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5z"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="2.5" y="5" width="7" height="14" rx="1.8"/><path d="M5.2 7h1.6"/><rect x="11.5" y="6" width="10" height="8" rx="1.2"/><path d="M10.5 17h12"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="8"/><path d="M12 8.5v4l2.8 1.8"/><path d="M9.5 2.5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 12.6a6 6 0 0 1-7.4 1.6L7 20.8a2.1 2.1 0 0 1-3-3l6.6-6.6A6 6 0 0 1 12.2 3.8l1.3 1.3a4 4 0 0 0 1.2 1.2z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V7z"/><path d="M14 3v4h4"/><path d="M9 11.5h6M9 14.5h6M9 17.5h3.5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 2.8v5.4c0 4.6-3 8.3-7 9.8-4-1.5-7-5.2-7-9.8V5.8z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4.2M12 17v.2"/></symbol>
    <symbol id="i-cloudlock" viewBox="0 0 24 24"><path d="M7 18.5h-.5a4 4 0 0 1-.6-8 6 6 0 0 1 11.7-1.2A4.6 4.6 0 0 1 18 18.5h-.5"/><rect x="9" y="14" width="6" height="5.5" rx="1.2"/><path d="M10.5 14v-1.3a1.5 1.5 0 0 1 3 0V14"/></symbol>
    <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></symbol>
  </defs>
</svg>

<svg class="layer" id="back"></svg>
<svg class="layer" id="front"></svg>

<div class="abs eyebrow"><svg viewBox="0 0 171.8 110"><g fill="none" stroke="var(--mark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h161.8v100H5zM105 5v100M105 66.8h61.8M128.6 66.8V105M105 81.4h23.6M119.6 66.8v14.6M5 105A100 100 0 0 1 105 5a61.8 61.8 0 0 1 61.8 61.8 38.2 38.2 0 0 1-38.2 38.2 23.6 23.6 0 0 1-23.6-23.6 14.6 14.6 0 0 1 14.6-14.6"/></g></svg><span>Hermit / Private Cloud</span></div>
<h1>Private Cloud: proof first</h1>
<div class="abs sub">Before each reply, your device checks NEAR AI Cloud's enclaves. Only then does your prompt leave.</div>

<div id="root"></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const root = document.getElementById('root');
const back = document.getElementById('back'), front = document.getElementById('front');
const ico = id => `<svg class="ico"><use href="#i-${id}"/></svg>`;
function div(cls, x, y, html, w) { const e = document.createElement('div'); e.className = 'abs ' + cls; e.style.left = x + 'px'; e.style.top = y + 'px'; if (w) e.style.width = w + 'px'; e.innerHTML = html; root.appendChild(e); return e; }
function el(parent, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function badge(cx, cy, n) { return div('badge', cx - 14, cy - 14, String(n)); }

/* ---------- geometry ---------- */
const X0 = 64, X1 = 1136;
const DEV = { x: 64, r: 476 };
const R = 108;                 // device rail (lane 1)
const ZX = 136;                // device text zone left
const BAR = 492;
const PAN = { x: 508, r: 944 };
const L2 = 626, L3 = 836, L4 = 1048;
const CHK = { x: 644, r: 1136 };
const TOP = 216;
const HDR = TOP + 48;

function hline(svg, x1, x2, y, o) {
  const color = o.color || 'var(--ink3)', w = o.w || 2;
  const dir = Math.sign(x2 - x1);
  const tip = x2, base = x2 - dir * 9;
  el(svg, 'path', { d: `M${x1} ${y}H${base}`, stroke: color, 'stroke-width': w, fill: 'none', 'stroke-dasharray': o.dash || '', 'stroke-linecap': o.dash ? 'butt' : 'round' });
  el(svg, 'path', { d: `M${tip} ${y}L${base} ${y - 5.5}L${base} ${y + 5.5}Z`, fill: color });
}
function gap(svg, x, y, w, h, fill) { el(svg, 'rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, fill }); }

function layout() {
  root.innerHTML = ''; back.innerHTML = ''; front.innerHTML = '';
  let y;

  /* ---------- lane headers ---------- */
  const H = [];
  H.push(div('card hdr dev', 84, HDR, `<div class="hl"><svg class="ico"><use href="#i-device"/></svg><span class="lab">Your iPhone or Mac</span></div><div class="sl">Checks everything</div><div class="refs"><div class="fr">HermitCloud/NearCloudAgent.swift</div><div class="fr">HermitCloud/NearAICloud.swift</div></div>`, 372));
  H.push(div('card hdr near', 520, HDR, `<div class="hl"><svg class="ico"><use href="#i-enclave"/></svg><span class="lab">Gateway enclave</span></div><div class="sl">Intel TDX</div><div class="refs"><div class="fr">cloud-api.near.ai</div><div class="fr">&nbsp;</div></div>`, 212));
  H.push(div('card hdr near', 740, HDR, `<div class="hl"><svg class="ico"><use href="#i-chip"/></svg><span class="lab">Model enclave</span></div><div class="sl">TDX and NVIDIA GPUs</div><div class="refs"><div class="fr">default model</div><div class="fr">Qwen/Qwen3.8-27B</div></div>`, 192));
  H.push(div('card hdr', 960, HDR, `<div class="hl"><svg class="ico"><use href="#i-globe"/></svg><span class="lab">NVIDIA NRAS</span></div><div class="sl">GPU verdict</div><div class="refs"><div class="fr">NearAICloud</div><div class="fr">.nvidiaVerdict</div></div>`, 176));
  const hh = Math.max(...H.map(h => h.offsetHeight)); H.forEach(h => h.style.height = hh + 'px');
  const LIFE0 = HDR + hh;

  /* ---------- phase A ---------- */
  y = LIFE0 + 30;
  const PA = y;  // phase rule centre
  y += 36;
  // 1 nonce
  const c1 = div('card std', ZX, y, `<div class="top"><div class="tile">${ico('clock')}</div><div><div class="lab">Fresh 32-byte nonce</div><div class="fr">AttestationVerifier.newNonce</div></div></div>`, 324);
  const y1 = y + c1.offsetHeight / 2; badge(R, y1, 1);
  const conn = div('conn', BAR - 8, y1 - 16, 'One watched HTTPS connection');
  const BAR0 = y1 + 16;
  y += c1.offsetHeight + 22;
  // 2 request
  const a2 = y + 24;
  div('al', ZX, a2 - 30, 'Attestation report request');
  div('am', ZX, a2 + 8, 'GET /v1/attestation/report');
  div('as', ZX, a2 + 28, 'Nonce in, no API key');
  badge(R, a2, 2);
  y = a2 + 28 + 20 + 18;
  // 3 reports back
  const a3 = y + 24;
  div('al', ZX, a3 - 30, 'Gateway and model reports');
  div('as', ZX, a3 + 8, 'TDX quotes, event logs, GPU evidence');
  div('pill onnear', (L2 + L3) / 2 - 62, a3 - 32, 'via the gateway');
  badge(R, a3, 3);
  y = a3 + 8 + 20 + 18;
  // 4 NRAS
  const a4 = y + 24;
  div('al', ZX, a4 - 30, 'GPU evidence');
  div('as', ZX, a4 + 8, 'Not your prompt');
  badge(R, a4, 4);
  const a4b = a4 + 8 + 20 + 18 + 24;
  div('al', ZX, a4b - 30, 'Signed verdict token');
  y = a4b + 30;
  // 5 checklist + device cards
  const ck = div('card chk', CHK.x, y, `<div class="top"><span class="lab">What your device checks</span></div>
    <div class="cols">
      <div><div class="gh">Gateway and model</div>
        ${['TDX v4 quote signature', 'Intel chain to SGX root', 'Debug mode off', 'Nonce inside the quote', 'Signing key bound', 'Config hash equals MRCONFIGID', 'Event log replays RTMR3'].map(t => `<div class="ti"><svg class="ico"><use href="#i-tick"/></svg><span>${t}</span></div>`).join('')}
      </div>
      <div style="display:flex;flex-direction:column"><div class="gh">GPUs and connection</div>
        ${['Nonce in GPU evidence', 'NVIDIA token:<br>key, issuer, time', 'Connection key<br>matches quote'].map(t => `<div class="ti"><svg class="ico"><use href="#i-tick"/></svg><span>${t}</span></div>`).join('')}
      </div>
    </div>
    <div class="fail"><svg class="ico"><use href="#i-warn"/></svg><span>Any check fails: nothing sent</span></div>`, CHK.r - CHK.x);
  const cA = div('card std', ZX, y, `<div class="top"><div class="tile">${ico('check')}</div><div><div class="lab">Checks run on device</div><div class="sl">Before anything is sent</div></div></div><div class="refs"><div class="fr">Attestation.swift, TDXQuote.swift</div><div class="fr">X509Lite.swift, TLSBinding.swift</div></div>`, 324);
  const cB = div('card std', ZX, y + cA.offsetHeight + 14, `<div class="top"><div class="tile">${ico('key')}</div><div><div class="lab">Key stays in Keychain</div><div class="sl">Not sent until all pass</div></div></div>`, 324);
  const cG = div('card std', ZX, 0, `<div class="top"><div class="tile" style="color:var(--bad)">${ico('warn')}</div><div><div class="lab">No verdict, no prompt</div><div class="sl">NRAS unreachable: nothing sent</div></div></div>`, 324);
  const y5 = y + 36; badge(R, y5, 5);
  const ckb = y + Math.max(ck.offsetHeight, cA.offsetHeight + cB.offsetHeight + cG.offsetHeight + 28);
  ck.style.height = (ckb - y) + 'px';
  cG.style.top = (ckb - cG.offsetHeight) + 'px';
  y = ckb;
  const A_END = y;

  /* ---------- phase B ---------- */
  y += 30; const PB = y; y += 36;
  const a6 = y + 24;
  div('al inline', ZX, a6 - 30, 'Prompt and API key');
  div('am', ZX + 158, a6 - 30, 'x-no-aliasing: true');
  div('as', ZX, a6 + 8, 'Same connection, no streaming');
  div('note', ZX, a6 + 36, `<svg class="ico"><use href="#i-key"/></svg><span>The key leaves only now</span>`);
  badge(R, a6, 6);
  const a7 = a6 + 60;
  badge(L2, a7, 7);
  div('pill onnear', L2 + 22, a7 - 32, 'forwarded');
  div('pill onnear', L2 + 22, a7 + 8, 'Hop not provable today');
  const a8 = a7 + 8 + 24 + 18 + 30;
  div('al', ZX, a8 - 30, 'Reply or tool calls');
  badge(R, a8, 8);
  y = a8 + 26;
  const c9 = div('card std', ZX, y, `<div class="top"><div class="tile">${ico('wrench')}</div><div><div class="lab">Tools run on device</div><div class="sl">Same guard, cleaner, policy</div></div></div><div class="loopnote"><svg class="ico"><use href="#i-loop"/></svg><div><div>Next round, same connection</div><div style="color:var(--ink3)">Up to 5 rounds</div></div></div>`, 324);
  const y9 = y + 36; badge(R, y9, 9);
  y += c9.offsetHeight;
  const BAR1 = a8 + 18;

  /* ---------- phase C ---------- */
  y += 30; const PC = y; y += 36;
  const a10 = y + 24;
  div('al', ZX, a10 - 30, 'Fetch the signature');
  div('am', ZX + 148, a10 - 30, 'GET /v1/signature/{id}');
  div('as', ZX, a10 + 8, 'Separate request, every completion');
  badge(R, a10, 10);
  y = a10 + 8 + 20 + 26;
  const c11 = div('card std sig', ZX, y, `<div class="top"><div class="tile">${ico('doc')}</div><div><div class="lab">Check the signature</div><div class="fr">ResponseSignature.swift</div></div></div>
    <div class="ticks" style="grid-template-columns:auto">${['Hash request and reply', 'Recover EIP-191 signer', 'Must be attested model key'].map(t => `<div class="ti"><svg class="ico"><use href="#i-tick"/></svg><span>${t}</span></div>`).join('')}</div>`, 324);
  badge(R, y + 36, 11);
  y += c11.offsetHeight + 14;
  const c12 = div('card std', ZX, y, `<div class="top"><div class="tile">${ico('shield')}</div><div><div class="lab">Verified sheet</div><div style="margin-top:4px"><span class="chipv"><svg class="ico"><use href="#i-tick"/></svg>Verified in a TEE</span></div></div></div>
    <div class="amberline"><svg class="ico"><use href="#i-warn"/></svg><span>Not model-signed:<br>review buttons hidden</span></div>`, 324);
  badge(R, y + 36, 12);
  y += c12.offsetHeight;
  const nc = div('card std nc', CHK.x, a10 + 52, `<div class="top"><div class="tile">${ico('doc')}</div><div><div class="lab">Also worth knowing</div><div class="sl">Shown in every Verified sheet</div></div></div>
    <div class="ncl">
      <div class="nci"><span class="dash"></span><div><div class="t">Intel TCB and revocation</div><div class="sl">Checked by near/verify-attestation.py</div></div></div>
      <div class="nci"><span class="dash"></span><div><div class="t">Gateway-to-model hop</div><div class="sl">Nobody can prove this one yet</div></div></div>
      <div class="nci"><span class="dash"></span><div><div class="t">Who built the images</div><div class="sl">The quote pins their compose hash</div></div></div>
    </div>`, CHK.r - CHK.x);
  const DEV_B = y + 24;

  /* ---------- containers ---------- */
  el(back, 'rect', { x: DEV.x + 1, y: TOP, width: DEV.r - DEV.x - 2, height: DEV_B - TOP, rx: 28, fill: 'var(--dev-wash)', stroke: 'var(--dev)', 'stroke-width': 2 });
  el(back, 'rect', { x: PAN.x, y: TOP, width: PAN.r - PAN.x, height: DEV_B - TOP, rx: 22, fill: 'var(--near-wash)', stroke: 'var(--near)', 'stroke-width': 1.5 });
  div('tag', 88, TOP - 15, `<svg viewBox="0 0 24 24"><rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.6 5.4h2.8"/></svg><svg viewBox="0 0 24 24"><rect x="4.2" y="5" width="15.6" height="10.6" rx="1.6"/><path d="M2.2 19h19.6"/></svg><span>On your iPhone or Mac</span>`);
  div('peb', PAN.x + 18, TOP + 14, `<svg class="ico"><use href="#i-cloudlock"/></svg><span>NEAR AI Cloud</span>`);

  /* ---------- lifelines ---------- */
  const LIFE1 = DEV_B - 20;
  for (const [x, c] of [[R, 'var(--dev)'], [L2, 'var(--near)'], [L3, 'var(--near)'], [L4, 'var(--ink3)']])
    el(back, 'path', { d: `M${x} ${LIFE0} V${LIFE1}`, stroke: c, 'stroke-width': 1.5, 'stroke-dasharray': '2 6', 'stroke-linecap': 'round', opacity: .55 });

  /* ---------- phase rules ---------- */
  for (const [yy, k, n, d] of [[PA, 'A', 'Proof', 'before anything is sent'], [PB, 'B', 'Prompt', 'on the checked connection'], [PC, 'C', 'Answer', 'checked when it comes back']]) {
    el(back, 'path', { d: `M${84} ${yy}H${X1}`, stroke: 'var(--line2)', 'stroke-width': 1 });
    div('ph', 80, yy - 14, `<span class="k">${k}</span><span class="n">${n}</span><span class="d">${d}</span>`).style.background = 'var(--dev-wash)';
  }

  /* ---------- the watched connection ---------- */
  el(back, 'path', { d: `M${BAR} ${BAR0} V${BAR1}`, stroke: 'var(--near)', 'stroke-width': 5, 'stroke-linecap': 'round' });

  /* ---------- arrows ---------- */
  const G = { color: 'var(--near)', w: 2 }, N = { color: 'var(--ink3)', w: 2 };
  const port = yy => { el(front, 'circle', { cx: BAR, cy: yy, r: 6, fill: 'var(--near)', stroke: 'var(--bg)', 'stroke-width': 2.5 }); };
  hline(front, R + 14, L2, a2, G); port(a2);
  hline(front, L3, L2, a3, { ...N, dash: '6 5' });
  hline(front, L2, R + 14, a3, G); port(a3);
  gap(back, BAR, a4, 16, 14, 'var(--bg)'); gap(back, BAR, a4b, 16, 14, 'var(--bg)');
  hline(front, R + 14, L4, a4, N);
  hline(front, L4, R + 14, a4b, N);
  // step 5: the checks card on the device points at its list
  gap(back, BAR, y5, 16, 14, 'var(--bg)');
  el(front, 'path', { d: `M${ZX + 324 + 5} ${y5}H${CHK.x - 5}`, stroke: 'var(--ink3)', 'stroke-width': 2, 'stroke-linecap': 'round' });
  for (const cx of [ZX + 324, CHK.x]) el(front, 'circle', { cx, cy: y5, r: 4, fill: 'var(--ink3)', stroke: 'var(--bg)', 'stroke-width': 2 });
  hline(front, R + 14, L2, a6, G); port(a6);
  hline(front, L2 + 14, L3, a7, { ...N, dash: '6 5' });
  hline(front, L2, R + 14, a8, G); port(a8);
  hline(front, R + 14, L2, a10, N);
  // loop 9 -> 6, left of the rail
  const lx = 82, r = 10;
  el(front, 'path', { d: `M${R - 14} ${y9} H${lx + r} Q${lx} ${y9} ${lx} ${y9 - r} V${a6 + r} Q${lx} ${a6} ${lx + r} ${a6} H${R - 14 - 9}`, stroke: 'var(--ink3)', 'stroke-width': 2, fill: 'none' });
  el(front, 'path', { d: `M${R - 14} ${a6}L${R - 23} ${a6 - 5.5}L${R - 23} ${a6 + 5.5}Z`, fill: 'var(--ink3)' });

  /* ---------- footer ---------- */
  const HT = DEV_B + 56;
  document.body.style.height = HT + 'px';
  back.setAttribute('height', HT); front.setAttribute('height', HT);
}

window.runChecks = function () {
  const W = 1200, H = document.body.offsetHeight;
  const out = { problems: [], fonts: [document.fonts.check("600 19px Geist"), document.fonts.check("450 13.5px 'Geist Mono'")] };
  const leaves = [...document.querySelectorAll('body *')].filter(e => !(e.closest('svg')) && [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim()));
  const boxes = [];
  for (const e of leaves) {
    const rng = document.createRange(); rng.selectNodeContents(e);
    const fs = parseFloat(getComputedStyle(e).fontSize);
    if (fs < 13.5) out.problems.push(`small font ${fs} "${e.textContent.trim()}"`);
    for (const r of rng.getClientRects()) {
      if (r.left < 0 || r.top < 0 || r.right > W || r.bottom > H) out.problems.push(`off canvas "${e.textContent.trim()}"`);
      boxes.push({ e, r, t: e.textContent.trim() });
    }
  }
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i].r, b = boxes[j].r;
    if (boxes[i].e.contains(boxes[j].e) || boxes[j].e.contains(boxes[i].e)) continue;
    if (a.left < b.right - 0.5 && b.left < a.right - 0.5 && a.top < b.bottom - 0.5 && b.top < a.bottom - 0.5) out.problems.push(`text overlap "${boxes[i].t}" / "${boxes[j].t}"`);
  }
  const blocks = [...document.querySelectorAll('#root > .card, #root > .al, #root > .am, #root > .as, #root > .pill, #root > .note, #root > .conn, #root > .badge, #root > .ph, #root > .foot, #root > .tag, #root > .peb, h1, .sub, .eyebrow')];
  for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++) {
    const a = blocks[i].getBoundingClientRect(), b = blocks[j].getBoundingClientRect();
    if (a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom) out.problems.push(`block overlap "${blocks[i].textContent.trim().slice(0, 24)}" / "${blocks[j].textContent.trim().slice(0, 24)}"`);
  }
  for (const c of document.querySelectorAll('.card')) {
    const cr = c.getBoundingClientRect();
    for (const k of c.querySelectorAll('span, div')) { const r = k.getBoundingClientRect(); if (r.width && (r.right > cr.right - 10 || r.left < cr.left + 10 || r.bottom > cr.bottom - 8)) out.problems.push(`tight in card: "${k.textContent.trim().slice(0, 30)}" ${Math.round(cr.right - r.right)}`); }
  }
  for (const e of document.querySelectorAll('.lab, .al, .pill, .conn')) { const n = e.textContent.trim().split(/\s+/).length; if (n > 5) out.problems.push(`label >5 words: "${e.textContent.trim()}"`); }
  out.size = [W, H];
  return out;
};
document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';
window.figureReady = document.fonts.ready.then(() => { layout(); });
window.figureCheck = () => window.runChecks();
</script>
</body></html>
